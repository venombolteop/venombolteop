# Save as: .github/workflows/metrics.yml
# Generates assets/metrics.svg — a rich profile card that INCLUDES private
# contributions but NEVER exposes repo names or details (aggregates only:
# contribution count, languages, achievements, lines of code).
#
# REQUIRED for private data: a Personal Access Token with the "repo" scope,
# stored as the GitHub secret METRICS_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
# Until that secret is added, this workflow falls back to GITHUB_TOKEN,
# which only sees public data.

name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          config_timezone: Asia/Kolkata
          filename: assets/metrics.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_lines: yes
          plugin_lines_history: 1000

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update GitHub metrics [skip ci]"
          git push
