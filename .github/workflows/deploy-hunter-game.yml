name: Deploy Hunter System Game

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/deploy-hunter-game.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hunter-system-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game site
        uses: actions/upload-pages-artifact@v3
        with:
          path: game

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
