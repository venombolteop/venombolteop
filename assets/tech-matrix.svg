<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Venom technology matrix</title>
<desc id="desc">An animated overview of backend, API, infrastructure, automation, data and interface interests. Bars are decorative, not skill ratings.</desc>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F81F7"/><stop offset="1" stop-color="#A5D6FF"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#30363D" stroke-width=".7"/></pattern>
</defs>
<rect width="1000" height="300" rx="16" fill="url(#panel)" stroke="#30363D"/>
<rect width="1000" height="300" rx="16" fill="url(#grid)" opacity=".65"/>
<text x="32" y="38" fill="#F0F6FC" font-family="monospace" font-size="15" letter-spacing="2">VENOM / TECH MATRIX</text>
<text x="968" y="38" text-anchor="end" fill="#8B949E" font-family="monospace" font-size="11">AREAS OF INTEREST</text>
<g font-family="monospace" font-size="14" fill="#C9D1D9">
  <text x="32" y="87">Backend engineering</text><text x="32" y="143">APIs &amp; integrations</text><text x="32" y="199">Infrastructure &amp; networking</text><text x="32" y="255">Automation &amp; tooling</text>
  <text x="525" y="87">Data &amp; persistence</text><text x="525" y="143">Developer experience</text><text x="525" y="199">Deployment workflows</text><text x="525" y="255">UI &amp; visual design</text>
</g>
<g fill="#21262D" stroke="#30363D">
  <rect x="32" y="98" width="430" height="7" rx="3.5"/><rect x="32" y="154" width="430" height="7" rx="3.5"/><rect x="32" y="210" width="430" height="7" rx="3.5"/><rect x="32" y="266" width="430" height="7" rx="3.5"/>
  <rect x="525" y="98" width="430" height="7" rx="3.5"/><rect x="525" y="154" width="430" height="7" rx="3.5"/><rect x="525" y="210" width="430" height="7" rx="3.5"/><rect x="525" y="266" width="430" height="7" rx="3.5"/>
</g>
<g fill="url(#line)">
  <rect x="32" y="98" width="290" height="7" rx="3.5"><animate attributeName="width" from="0" to="290" dur="1.4s" fill="freeze"/></rect>
  <rect x="32" y="154" width="340" height="7" rx="3.5"><animate attributeName="width" from="0" to="340" dur="1.4s" begin=".15s" fill="freeze"/></rect>
  <rect x="32" y="210" width="310" height="7" rx="3.5"><animate attributeName="width" from="0" to="310" dur="1.4s" begin=".3s" fill="freeze"/></rect>
  <rect x="32" y="266" width="275" height="7" rx="3.5"><animate attributeName="width" from="0" to="275" dur="1.4s" begin=".45s" fill="freeze"/></rect>
  <rect x="525" y="98" width="320" height="7" rx="3.5"><animate attributeName="width" from="0" to="320" dur="1.4s" begin=".1s" fill="freeze"/></rect>
  <rect x="525" y="154" width="280" height="7" rx="3.5"><animate attributeName="width" from="0" to="280" dur="1.4s" begin=".25s" fill="freeze"/></rect>
  <rect x="525" y="210" width="350" height="7" rx="3.5"><animate attributeName="width" from="0" to="350" dur="1.4s" begin=".4s" fill="freeze"/></rect>
  <rect x="525" y="266" width="245" height="7" rx="3.5"><animate attributeName="width" from="0" to="245" dur="1.4s" begin=".55s" fill="freeze"/></rect>
</g>
<path d="M32 55H968" stroke="#30363D"/>
<circle cx="968" cy="55" r="3" fill="#79C0FF"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
</svg>