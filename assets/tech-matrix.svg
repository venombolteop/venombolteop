<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#7f9cf5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f9cf5"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="100%" stop-color="#ff9e64"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#e0af68"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#00d8b5"/>
    </linearGradient>
  </defs>

  <g font-family="'Fira Code', Menlo, Consolas, monospace">

    <text x="30" y="32" font-size="14" fill="#c9d1d9">Backend Engineering</text>
    <text x="700" y="32" font-size="13" fill="#00ADD8" text-anchor="end">95%</text>
    <rect x="170" y="21" width="520" height="14" rx="7" fill="#30363d"/>
    <rect x="170" y="21" width="494" height="14" rx="7" fill="url(#g1)">
      <animate attributeName="width" from="0" to="494" dur="1.6s" begin="0.2s" fill="freeze"/>
    </rect>

    <text x="30" y="68" font-size="14" fill="#c9d1d9">API Design &amp; Integration</text>
    <text x="700" y="68" font-size="13" fill="#7f9cf5" text-anchor="end">92%</text>
    <rect x="170" y="57" width="520" height="14" rx="7" fill="#30363d"/>
    <rect x="170" y="57" width="478" height="14" rx="7" fill="url(#g2)">
      <animate attributeName="width" from="0" to="478" dur="1.6s" begin="0.4s" fill="freeze"/>
    </rect>

    <text x="30" y="104" font-size="14" fill="#c9d1d9">Proxy &amp; Network Routing</text>
    <text x="700" y="104" font-size="13" fill="#bb9af7" text-anchor="end">88%</text>
    <rect x="170" y="93" width="520" height="14" rx="7" fill="#30363d"/>
    <rect x="170" y="93" width="458" height="14" rx="7" fill="url(#g3)">
      <animate attributeName="width" from="0" to="458" dur="1.6s" begin="0.6s" fill="freeze"/>
    </rect>

    <text x="30" y="140" font-size="14" fill="#c9d1d9">DevOps &amp; Infrastructure</text>
    <text x="700" y="140" font-size="13" fill="#f7768e" text-anchor="end">85%</text>
    <rect x="170" y="129" width="520" height="14" rx="7" fill="#30363d"/>
    <rect x="170" y="129" width="442" height="14" rx="7" fill="url(#g4)">
      <animate attributeName="width" from="0" to="442" dur="1.6s" begin="0.8s" fill="freeze"/>
    </rect>

    <text x="30" y="176" font-size="14" fill="#c9d1d9">Frontend (React / Vue)</text>
    <text x="700" y="176" font-size="13" fill="#ff9e64" text-anchor="end">70%</text>
    <rect x="170" y="165" width="520" height="14" rx="7" fill="#30363d"/>
    <rect x="170" y="165" width="364" height="14" rx="7" fill="url(#g5)">
      <animate attributeName="width" from="0" to="364" dur="1.6s" begin="1s" fill="freeze"/>
    </rect>

    <text x="30" y="212" font-size="14" fill="#c9d1d9">Digital Text Design</text>
    <text x="700" y="212" font-size="13" fill="#00d8b5" text-anchor="end">65%</text>
    <rect x="170" y="201" width="520" height="14" rx="7" fill="#30363d"/>
    <rect x="170" y="201" width="338" height="14" rx="7" fill="url(#g6)">
      <animate attributeName="width" from="0" to="338" dur="1.6s" begin="1.2s" fill="freeze"/>
    </rect>

    <text x="30" y="238" font-size="11" fill="#484f58">self-measured intensity across the Venom stack — updated as skills evolve ⚡</text>
  </g>
</svg>
