<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="50%" stop-color="#7f9cf5"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="sweep" x1="-1" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7f9cf5" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#7f9cf5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f7768e" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-800 0" to="800 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7f9cf5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f9cf5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#grid)" opacity="0.5"/>
  <rect width="800" height="200" fill="url(#sweep)"/>
  <ellipse cx="400" cy="100" rx="330" ry="90" fill="url(#glow)"/>

  <text x="400" y="112" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="66" font-weight="900" text-anchor="middle" fill="url(#textGrad)" letter-spacing="6">VENOM</text>

  <text x="400" y="150" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16" text-anchor="middle" fill="#8b949e" letter-spacing="3">BACKEND &#8226; API &#8226; PROXY ARCHITECTURE</text>

  <text x="400" y="176" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#484f58">&lt;/&gt; PRODUCTION-READY CODE ONLY</text>

  <g fill="#00ADD8">
    <circle cx="70" cy="40" r="2.2">
      <animate attributeName="cy" values="210;10" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80" r="1.6">
      <animate attributeName="cy" values="210;10" dur="9s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="60" r="2">
      <animate attributeName="cy" values="210;10" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="110" r="1.8">
      <animate attributeName="cy" values="210;10" dur="8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="30" r="1.4">
      <animate attributeName="cy" values="210;10" dur="10s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="170" r="2">
      <animate attributeName="cy" values="210;10" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#7f9cf5">
    <circle cx="250" cy="140" r="1.6">
      <animate attributeName="cy" values="210;10" dur="8.5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="40" r="1.5">
      <animate attributeName="cy" values="210;10" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="150" r="2">
      <animate attributeName="cy" values="210;10" dur="6.5s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="120" r="1.7">
      <animate attributeName="cy" values="210;10" dur="9.5s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9.5s" begin="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#f7768e">
    <circle cx="360" cy="150" r="1.6">
      <animate attributeName="cy" values="210;10" dur="6.2s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6.2s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="160" r="1.9">
      <animate attributeName="cy" values="210;10" dur="7.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
